<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6d5efc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Bütçem</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <div class="app">
    <nav class="nav" id="nav">
      <div class="brand">💰 Bütçem</div>
      <button data-action="nav" data-view="home"><span>🏠</span><small>Özet</small></button>
      <button data-action="nav" data-view="tx"><span>📋</span><small>İşlemler</small></button>
      <button data-action="nav" data-view="plan"><span>🎯</span><small>Plan</small><i class="nav-badge" id="badge-plan" hidden></i></button>
      <button data-action="nav" data-view="cards"><span>💳</span><small>Kartlar</small><i class="nav-badge" id="badge-cards" hidden></i></button>
      <button data-action="nav" data-view="report"><span>📊</span><small>Rapor</small></button>
      <button class="desk-only" data-action="nav" data-view="settings"><span>⚙️</span><small>Ayarlar</small></button>
    </nav>
    <main id="main"></main>
  </div>
  <button class="fab" data-action="add-tx" aria-label="İşlem ekle">+</button>
  <div id="sheet-root"></div>
  <div id="toast-root"></div>
  <script src="firebase-config.js?v=6"></script>
  <script src="app.js?v=6"></script>
  <script src="budget.js?v=6"></script>
  <script src="recurring.js?v=6"></script>
  <script src="accounts.js?v=6"></script>
  <script src="ai.js?v=6"></script>
  <script src="home.js?v=6"></script>
  <script src="start.js?v=6"></script>
</body>
</html>
