<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C0C0D" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bütçem</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
  <div class="app">
    <nav class="nav" id="nav">
      <div class="brand"><span class="brand-mark"></span>Bütçem</div>
      <button data-action="nav" data-view="home"><span data-i="house"></span><small>Özet</small></button>
      <button data-action="nav" data-view="tx"><span data-i="list"></span><small>İşlemler</small><i class="nav-badge" id="badge-tx" hidden></i></button>
      <button data-action="nav" data-view="plan"><span data-i="target"></span><small>Plan</small><i class="nav-badge" id="badge-plan" hidden></i></button>
      <button data-action="nav" data-view="cards"><span data-i="credit-card"></span><small>Kartlar</small><i class="nav-badge" id="badge-cards" hidden></i></button>
      <button data-action="nav" data-view="report"><span data-i="chart-column"></span><small>Rapor</small></button>
      <button class="desk-only" data-action="nav" data-view="settings"><span data-i="settings"></span><small>Ayarlar</small></button>
    </nav>
    <main id="main"></main>
  </div>
  <button class="fab" data-action="add-tx" aria-label="İşlem ekle"><span data-i="plus"></span></button>
  <div id="sheet-root"></div>
  <div id="toast-root"></div>
  <script src="firebase-config.js?v=13"></script>
  <script src="icons.js?v=13"></script>
  <script src="app.js?v=13"></script>
  <script src="budget.js?v=13"></script>
  <script src="recurring.js?v=13"></script>
  <script src="accounts.js?v=13"></script>
  <script src="ai.js?v=13"></script>
  <script src="home.js?v=13"></script>
  <script src="start.js?v=13"></script>
</body>
</html>
